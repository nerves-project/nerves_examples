version: 2
updates:
  - package-ecosystem: mix
    directories:
      - "/blinky"
      - "/hello_erlang"
      - "/hello_gpio"
      - "/hello_lfe"
      - "/hello_live_view"
      - "/poncho_phoenix"
      - "/hello_snmp_agent"
      - "/hello_snmp_manager"
      - "/hello_sqlite"
      - "/hello_wifi"
      - "/hello_zig"
      - "/minimal"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      systems:
        patterns:
          - "nerves_system*"
      deps:
        patterns:
          - "*"
        exclude-patterns:
          - "nerves_system*"
